version: v0.2
forbidden:
  decision: block
  patterns:
    - "rm -rf /"
    - "sudo rm -rf /"
    - "rm -rf /*"
    - "rm -rf ~"
    - "mkfs"
    - "dd if="
    - "cat ~/.ssh/"
    - "cat /root/.ssh/"
    - "cat ~/.aws/credentials"
    - "cat ~/.config/"
    - "env | grep"
    - "printenv"
    - "systemctl disable ufw"
    - "systemctl stop ufw"
    - "iptables -f"
    - "history -c"
    - "rm ~/.bash_history"
    - "rm /var/log"
    - "truncate -s 0 /var/log"
    - "journalctl --vacuum"
    - "diskutil erasedisk"
    - "chmod -r 777 /"
    - "chown -r"
    - ":(){ :|:& };:"
    - "/dev/sd"
    - "curl | sh"
    - "wget | sh"
    - "curl | bash"
    - "wget | bash"
    - "security find-generic-password"
    - "cat /etc/shadow"
    - "launchctl unload"
    - "visudo"
    - "/etc/sudoers"
    - "shutdown"
    - "reboot"
critical:
  decision: explicit_confirmation_required
  patterns:
    - "rm "
    - "userdel"
    - "passwd "
    - "systemctl stop"
high:
  decision: backup_required
  patterns:
    - "/etc/"
    - "chmod"
    - "chown"
    - "systemctl restart"
    - "ufw "
medium:
  decision: approval_required
  patterns:
    - "sudo apt update"
    - "sudo apt install"
    - "apt install"
    - "mkdir"
    - "touch"
    - "docker run"
low:
  decision: allow
  prefixes:
    - "df"
    - "free"
    - "uptime"
    - "pwd"
    - "ls"
    - "systemctl status"
    - "docker --version"
    - "docker version"
    - "docker ps"
    - "uname"
    - "whoami"
