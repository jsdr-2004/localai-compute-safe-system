hardware_profile_id: HP-001
runtime: ollama

models:
  - name: llama3.2:1b
    size: 1B
    quantization: default
  - name: llama3.2:3b
    size: 3B
    quantization: default
  - name: qwen2.5:3b
    size: 3B
    quantization: default
  - name: mistral:7b
    size: 7B
    quantization: default

settings:
  context_lengths: [1024, 2048]
  temperatures: [0.2, 0.7]
  top_p: [0.8, 0.95]

repeat_each_test: 3
output_csv: ../../data/templates/benchmark_results.csv
